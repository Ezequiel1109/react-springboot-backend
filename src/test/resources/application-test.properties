# Configuración para tests con Docker
# Perfil de test
spring.profiles.active=test

# Base de datos para tests (cuando usar MySQL en Docker)
spring.datasource.url=jdbc:mysql://localhost:3307/testdb
spring.datasource.username=testuser
spring.datasource.password=testpass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate para tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Logging para tests
logging.level.com.david.springboot.backend=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Desactivar seguridad para algunos tests (opcional)
# spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# Configuración para Testcontainers
# No es necesario configurar nada específico, Testcontainers maneja todo automáticamente