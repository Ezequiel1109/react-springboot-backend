# k8s/mysql-pvc.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: react-springboot-products
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi # Ajustar según necesidades
  # storageClassName: standard  # Descomentar si tu cluster lo requiere